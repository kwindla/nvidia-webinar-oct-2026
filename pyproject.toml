[project]
name = "nvidia-webinar-oct-2026"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.4",
    "anthropic>=0.70",
    "gguf>=0.19.0",
    "huggingface-hub>=1.5,<2",
    "librosa>=0.10,<1",
    "pipecat-ai[deepgram,openai,runner,silero,webrtc]>=1.12.0",
    "pocket-tts>=3.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6,<7",
    "sentencepiece>=0.1.98,<0.3",
    "soundfile>=0.13.1",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "typesafe-sdk>=0.1",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.10,<4",
    "scipy>=1.17,<2",
]
